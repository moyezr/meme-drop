[project]
name = "memedrop-api"
version = "0.1.0"
description = "FastAPI backend for MemeDrop"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14.0",
  "boto3>=1.43.62",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pgvector>=0.3.6",
  "psycopg[binary,pool]>=3.2.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.34.0",
]

[project.scripts]
memedrop-db-init = "memedrop_api.cli:db_init"
memedrop-db-seed = "memedrop_api.cli:db_seed"
memedrop-db-seed-memes = "memedrop_api.cli:db_seed_memes"
memedrop-validate-production-env = "memedrop_api.cli:validate_production_env"
memedrop-usage-feedback = "memedrop_api.cli:usage_feedback"
memedrop-storage-check = "memedrop_api.cli:storage_check"

[dependency-groups]
dev = [
  "mypy>=1.14.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "respx>=0.22.0",
  "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memedrop_api"]

[tool.vercel]
entrypoint = "memedrop_api.main:app"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires MEMEDROP_TEST_DATABASE_URL and a PostgreSQL server with pgvector",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.coverage.run]
branch = true
source = ["memedrop_api"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

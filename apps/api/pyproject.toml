[project]
name = "memedrop-api"
version = "0.1.0"
description = "FastAPI backend for MemeDrop"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pgvector>=0.3.6",
  "psycopg[binary,pool]>=3.2.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.34.0",
]

[project.scripts]
memedrop-db-init = "memedrop_api.cli:db_init"
memedrop-db-seed = "memedrop_api.cli:db_seed"
memedrop-db-seed-memes = "memedrop_api.cli:db_seed_memes"
memedrop-validate-production-env = "memedrop_api.cli:validate_production_env"
memedrop-usage-feedback = "memedrop_api.cli:usage_feedback"

[dependency-groups]
dev = [
  "mypy>=1.14.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "respx>=0.22.0",
  "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memedrop_api"]

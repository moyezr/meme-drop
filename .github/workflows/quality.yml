name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  static:
    name: Static quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          npm ci
          uv sync --project apps/api --frozen

      - name: Run release dry run
        run: npm run release:dry-run

      - name: Upload extension package
        uses: actions/upload-artifact@v7
        with:
          name: memedrop-extension-release
          path: .memedrop/memedrop-extension-v*.zip
          if-no-files-found: error
          include-hidden-files: true

  backend-image:
    name: Backend image smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and smoke backend image
        run: npm run quality:backend-image

  suggestion-quality:
    name: Suggestion quality gate
    runs-on: ubuntu-latest
    if: ${{ vars.MEMEDROP_RUN_MODEL_EVALS == 'true' }}
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memedrop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/memedrop
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
      OPENROUTER_APP_NAME: MemeDrop CI
      MEMEDROP_SUGGESTION_LOGS: compact
      MEMEDROP_FAST_ANALYSIS: heuristic
      MEMEDROP_CAPTION_TIMEOUT_MS: 3000
      MEMEDROP_USE_CONTEXTUAL_CAPTION_FALLBACK: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          npm ci
          uv sync --project apps/api --frozen

      - name: Initialize database
        run: npm run db:init

      - name: Run suggestion eval
        run: npm run quality:suggestions

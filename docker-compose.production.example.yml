services:
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-memedrop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MEMEDROP_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:?set OPENROUTER_SITE_URL}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-MemeDrop}
      MEMEDROP_CORS_ORIGINS: ${MEMEDROP_CORS_ORIGINS:?set MEMEDROP_CORS_ORIGINS}
      MEMEDROP_RATE_LIMIT_STORE: database
      MEMEDROP_REQUIRE_INSTALL_ID: "true"
      MEMEDROP_CAPTION_TIMEOUT_MS: ${MEMEDROP_CAPTION_TIMEOUT_MS:-3000}
      MEMEDROP_USE_DRAFT_TEMPLATES: "false"
      MEMEDROP_LOG_LEVEL: ${MEMEDROP_LOG_LEVEL:-info}
      MEMEDROP_SUGGESTION_LOGS: ${MEMEDROP_SUGGESTION_LOGS:-compact}
      MEMEDROP_SUGGESTION_LOG_TEXT: redacted
      MEMEDROP_IMAGE_DOWNLOAD_TIMEOUT_MS: ${MEMEDROP_IMAGE_DOWNLOAD_TIMEOUT_MS:-10000}
      MEMEDROP_MAX_IMAGE_BYTES: ${MEMEDROP_MAX_IMAGE_BYTES:-8388608}
      MEME_STORAGE_PATH: /var/lib/memedrop/memes
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - meme-assets:/var/lib/memedrop/memes
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/live', timeout=3)\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  pgdata:
  meme-assets:

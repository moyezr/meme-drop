[project]
name = "memedrop-workspace"
version = "0.0.1"
requires-python = ">=3.12,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
markers = [
  "integration: requires MEMEDROP_TEST_DATABASE_URL and a PostgreSQL server with pgvector",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.coverage.run]
branch = true
source = ["memedrop_api"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
